<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>알람 앱</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="hero-clock">
      <img src="images/알람시계_re.png" alt="알람 시계" class="hero-image" />
      <div class="hand-pivot">
        <div class="hand hour-hand" id="hourHand"></div>
        <div class="hand minute-hand" id="minuteHand"></div>
        <div class="hand second-hand" id="secondHand"></div>
      </div>
    </div>
    <h1>알람</h1>

    <div class="clock" id="clock">00:00:00</div>

    <div class="add-alarm">
      <input type="time" id="alarmTime" />
      <input type="text" id="alarmLabel" placeholder="알람 이름 (선택)" />
      <button id="addBtn">추가</button>
    </div>

    <ul class="alarm-list" id="alarmList"></ul>

    <div class="weather" id="weather">기온 불러오는 중...</div>
  </div>

  <div class="ringing-overlay" id="ringingOverlay">
    <div class="ringing-box">
      <p class="ringing-label" id="ringingLabel">알람</p>
      <p class="ringing-time" id="ringingTime">00:00</p>
      <button id="stopBtn">알람 끄기</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
