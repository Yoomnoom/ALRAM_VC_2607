<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>알람 앱</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="news/news.css" />
</head>
<body>
  <div class="weather-bg" id="weatherBg"></div>

  <div class="layout">
  <div class="app">
    <div class="weather" id="weather">기온 불러오는 중...</div>
    <select id="weatherPreviewSelect" class="weather-preview-select">
      <option value="">🔍 날씨 배경 미리보기</option>
      <option value="Clear">☀️ 맑음</option>
      <option value="Clouds">☁️ 구름</option>
      <option value="Rain">🌧️ 비</option>
      <option value="Drizzle">🌦️ 이슬비</option>
      <option value="Thunderstorm">⛈️ 뇌우</option>
      <option value="Snow">❄️ 눈</option>
      <option value="Mist">🌫️ 안개</option>
    </select>

    <div class="hero-clock">
      <img src="images/알람시계_re.png" alt="알람 시계" class="hero-image" />
      <div class="hand-pivot">
        <div class="hand hour-hand" id="hourHand"></div>
        <div class="hand minute-hand" id="minuteHand"></div>
        <div class="hand second-hand" id="secondHand"></div>
      </div>
    </div>
    <h1>알람</h1>

    <div class="clock" id="clock">00:00:00</div>

    <div class="list-header">
      <span class="list-title">알람 목록</span>
      <button type="button" class="fab-add" id="openAddBtn">+</button>
    </div>

    <ul class="alarm-list" id="alarmList"></ul>

    <div class="save-alarms-row">
      <button type="button" class="news-btn" id="openNewsBtn">📰 최근뉴스</button>
    </div>
  </div>

  <div class="news-panel" id="newsOverlay">
    <div class="news-box">
      <div class="news-box-header">
        <div class="news-box-header-left">
          <span class="news-box-title">최근뉴스</span>
          <button type="button" class="save-alarms-btn" id="saveAlarmsBtn">💾 지금 저장</button>
          <a
            href="https://docs.google.com/spreadsheets/d/1GSkyVyhoKIl0hLsKEXRtBnM6TeVa01I5xEVgz5t40TY/edit?gid=110008335#gid=110008335"
            target="_blank"
            rel="noopener noreferrer"
            class="news-sheet-link"
            title="저장 시트 열기"
            >📊 시트 보기</a
          >
          <span class="save-alarms-status" id="saveAlarmsStatus"></span>
        </div>
        <button type="button" class="news-close-btn" id="closeNewsBtn">✕</button>
      </div>
      <div class="news-search-row">
        <input
          type="text"
          id="newsSearchInput"
          class="news-search-input"
          placeholder="관심 키워드를 검색해보세요 (예: 부동산)"
          maxlength="20"
        />
        <button type="button" class="news-search-btn" id="newsSearchBtn">🔍 검색</button>
      </div>
      <div class="news-search-result" id="newsSearchResult"></div>
      <div class="news-meta-row">
        <span class="news-refreshed-at" id="newsRefreshedAt"></span>
        <label class="news-select-all-row">
          <input type="checkbox" id="newsSelectAllCheckbox" />
          뉴스 전체 선택
        </label>
      </div>
      <div class="news-list" id="newsTable"></div>
    </div>
  </div>
  </div>

  <div class="add-alarm-overlay" id="addAlarmOverlay">
    <div class="add-alarm-box">
      <div class="add-alarm">
        <div class="field-group">
          <span class="field-label">⏰ 시간</span>
          <button type="button" class="time-display" id="timeDisplayBtn">시간을 선택하세요</button>
        </div>

        <div class="field-group">
          <span class="field-label">🔁 반복</span>
          <select id="repeatType">
            <option value="once">한 번만</option>
            <option value="daily" selected>매일</option>
            <option value="weekdays">월-금 (평일)</option>
            <option value="interval">주기 반복 (N일마다)</option>
            <option value="custom">사용자 지정 (요일 선택)</option>
          </select>
        </div>

        <div class="field-group" id="customDaysGroup" hidden>
          <span class="field-label">📅 요일 선택</span>
          <div class="day-picker" id="dayPicker">
            <button type="button" class="day-btn" data-day="0">일</button>
            <button type="button" class="day-btn" data-day="1">월</button>
            <button type="button" class="day-btn" data-day="2">화</button>
            <button type="button" class="day-btn" data-day="3">수</button>
            <button type="button" class="day-btn" data-day="4">목</button>
            <button type="button" class="day-btn" data-day="5">금</button>
            <button type="button" class="day-btn" data-day="6">토</button>
          </div>
        </div>

        <div class="field-group" id="intervalGroup" hidden>
          <span class="field-label">🔁 주기 설정</span>
          <div class="interval-row">
            <input type="date" id="intervalStartDate" />
            <input type="number" id="intervalDays" min="1" max="365" value="2" />
            <span>일마다</span>
          </div>
        </div>

        <input type="text" id="alarmLabel" placeholder="✏️ 알람 이름 (선택)" />

        <div class="field-group">
          <span class="field-label">🔔 알람음</span>
          <select id="alarmSound">
            <option value="beep">삐삐 (기본)</option>
            <option value="chime">차임벨</option>
            <option value="digital">디지털음</option>
          </select>
        </div>

        <div class="add-alarm-actions">
          <button type="button" id="cancelAddBtn" class="cancel-add-btn">취소</button>
          <button id="addBtn">알람 추가</button>
        </div>
      </div>
    </div>
  </div>

  <div class="time-picker-overlay" id="timePickerOverlay">
    <div class="time-picker-box">
      <div class="time-picker-numbers">
        <input type="number" id="hourInput" min="1" max="12" value="7" />
        <span class="colon">:</span>
        <input type="number" id="minuteInput" min="0" max="59" value="0" />
        <div class="ampm-toggle" id="ampmToggle">
          <button type="button" class="ampm-btn" data-ampm="AM">오전</button>
          <button type="button" class="ampm-btn selected" data-ampm="PM">오후</button>
        </div>
      </div>

      <div class="mode-toggle" id="modeToggle">
        <button type="button" class="mode-btn selected" data-mode="hour">시</button>
        <button type="button" class="mode-btn" data-mode="minute">분</button>
      </div>

      <div class="analog-clock" id="analogClock">
        <div class="clock-face">
          <span class="tick" style="--i:0">12</span>
          <span class="tick" style="--i:1">1</span>
          <span class="tick" style="--i:2">2</span>
          <span class="tick" style="--i:3">3</span>
          <span class="tick" style="--i:4">4</span>
          <span class="tick" style="--i:5">5</span>
          <span class="tick" style="--i:6">6</span>
          <span class="tick" style="--i:7">7</span>
          <span class="tick" style="--i:8">8</span>
          <span class="tick" style="--i:9">9</span>
          <span class="tick" style="--i:10">10</span>
          <span class="tick" style="--i:11">11</span>
        </div>
        <div class="clock-hand pick-hour-hand" id="pickHourHand"></div>
        <div class="clock-hand pick-minute-hand" id="pickMinuteHand"></div>
        <div class="clock-center-dot"></div>
      </div>

      <div class="time-picker-actions">
        <button type="button" id="timePickerCancel" class="picker-cancel">취소</button>
        <button type="button" id="timePickerConfirm" class="picker-confirm">확인</button>
      </div>
    </div>
  </div>

  <div class="ringing-overlay" id="ringingOverlay">
    <div class="ringing-box">
      <p class="ringing-label" id="ringingLabel">알람</p>
      <p class="ringing-time" id="ringingTime">00:00</p>
      <div class="briefing-list" id="newsBriefingList"></div>
      <div class="snooze-picker" id="snoozePicker">
        <button type="button" class="snooze-min-btn" data-min="5">5분</button>
        <button type="button" class="snooze-min-btn" data-min="10">10분</button>
        <button type="button" class="snooze-min-btn" data-min="15">15분</button>
      </div>
      <div class="ringing-actions">
        <button id="snoozeBtn" class="snooze-btn">다시 울림</button>
        <button id="stopBtn">알람 끄기</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
  <script src="news/news.js"></script>
</body>
</html>
